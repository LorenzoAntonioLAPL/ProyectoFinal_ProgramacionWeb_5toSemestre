<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Recuperar contraseña</title>
  <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #222;
      padding: 30px;
      border-radius: 10px;
      width: 350px;
      text-align: center;
      box-shadow: 0 0 20px #000;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      background: crimson;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: rgb(255, 56, 89);
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Recuperar contraseña</h2>

  <form id="resetForm">
    <input type="password" id="newPassword" placeholder="Nueva contraseña" required>
    <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" required>
    <button type="submit">Cambiar contraseña</button>
  </form>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  if (!token) {
    swal("Error", "Token no encontrado en la URL", "error")
  }

  const form = document.getElementById("resetForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword !== confirmPassword) {
      swal("Error", "Las contraseñas no coinciden", "error");
      return;
    }

    if (newPassword.length < 6) {
      swal("Error", "La contraseña debe tener mínimo 6 caracteres", "error");
      return;
    }

    try {
      const res = await fetch("https://proyectofinal-programacionweb-5tosemestre.onrender.com/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, newPassword })
      });

      const data = await res.json();

      if (!res.ok) {
        swal("Error", data.msg || "Algo salió mal", "error");
        return;
      }

      swal("Listo", data.msg, "success")
        .then(() => {
          window.location.href = "index.html"
        });

    } catch (error) {
      console.error(error);
      swal("Error", "No se pudo conectar al servidor", "error");
    }
  });
</script>

</body>
</html>
